[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "rko_lio"
version = "0.4.0"
description = "A Robust Approach for LiDAR-Inertial Odometry Without Sensor-Specific Modelling"
authors = [{ name = "Meher Malladi", email = "rm.meher97@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Other Audience",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: Unix",
]
keywords = [
  "LiDAR",
  "IMU",
  "Odometry",
  "Localization",
  "SLAM",
]
dependencies = [
  "numpy~=2.2",
  "typer>=0.19,<0.28",
  "pyyaml~=6.0",
  "pyquaternion>=0.9,<0.10",
  "tqdm~=4.67"
]

[project.optional-dependencies]
all = [
  "plyfile>=1,<2",
  "rerun-sdk>=0.31,<0.36",
  "rosbags>=0.10,<0.12",
]

[project.urls]
Homepage = "https://github.com/PRBonn/rko_lio"

[project.scripts]
rko_lio = "rko_lio.cli:app"

[tool.scikit-build]
wheel.packages = ["rko_lio/python/rko_lio"]
build-dir = "build/{wheel_tag}"
build.verbose = true
editable.mode = "redirect"
editable.rebuild = true
editable.verbose = true

[tool.scikit-build.cmake]
source-dir = "rko_lio/python/pybind"
version = ">=3.28"
build-type = "Release"

[tool.scikit-build.cmake.define]
CMAKE_EXPORT_COMPILE_COMMANDS = "ON"
RKO_LIO_FETCH_CONTENT_DEPS = "ON"
RKO_LIO_BUILD_ROS = "OFF"
RKO_LIO_SCALAR = "double"
# TODO: inherited from kiss-icp, need unverified. oneTBB calls static builds unsupported
BUILD_SHARED_LIBS = "OFF"

[tool.cibuildwheel]
environment = { GIT_LFS_SKIP_SMUDGE = "1" }
archs = ["auto64"]
skip = ["*-musllinux*", "pp*", "cp38-*", "cp39-*"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
environment = "MACOSX_DEPLOYMENT_TARGET=11.0"
archs = ["x86_64", "arm64"]

[tool.pytest]
minversion = "9.0"
addopts = ["-v"]
testpaths = [
  "tests/python"
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
  ".cmake-format.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# re-exports
"__init__.py" = ["F401"]
"docs/conf.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# typer puts CLI metadata in argument defaults
extend-immutable-calls = ["typer.Argument", "typer.Option"]
