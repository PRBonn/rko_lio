name: ROS Build
on:
  pull_request:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check_relevant_changes:
    uses: ./.github/workflows/check_relevant_changes.yaml
    with:
      ignored_folders: "rko_lio/python|docs|tests/python|tests/core|cmake/dependencies/catch2|.github"
      ignored_files: "pyproject.toml|CHANGELOG.rst|LICENSE|README.md|.pre-commit-config.yaml"
      self: ".github/workflows/ros_build.yaml|.github/workflows/check_relevant_changes.yaml"
  ros_build_with_rosdep:
    needs: check_relevant_changes
    if: needs.check_relevant_changes.outputs.continue_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ros_distro: humble, container_image: "ros:humble-ros-base"}
          - {ros_distro: jazzy, container_image: "ros:jazzy-ros-base"}
          - {ros_distro: kilted, container_image: "ros:kilted-ros-base"}
          - {ros_distro: lyrical, container_image: "ros:lyrical-ros-base",}
          # - { ros_distro: rolling, container_image: "ros:rolling-ros-base"}
    container:
      image: ${{ matrix.container_image }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y build-essential cmake git
      - name: Source ROS environment, install dependencies, and build
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          rosdep init 2>/dev/null || true
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y
          colcon build --event-handlers console_direct+
  ros_build_no_rosdep:
    needs: check_relevant_changes
    if: needs.check_relevant_changes.outputs.continue_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ros_distro: humble, container_image: "ros:humble-ros-base"}
          - {ros_distro: jazzy, container_image: "ros:jazzy-ros-base"}
          - {ros_distro: kilted, container_image: "ros:kilted-ros-base"}
          - {ros_distro: lyrical, container_image: "ros:lyrical-ros-base"}
          - {ros_distro: rolling, container_image: "ros:rolling-ros-base"}
    container:
      image: ${{ matrix.container_image }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y build-essential cmake git
      - name: Source ROS environment and build with extra CMake args
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          colcon build --event-handlers console_direct+ \
            --cmake-args -DRKO_LIO_FETCH_CONTENT_DEPS=ON -DRKO_LIO_BUILD_TESTS=ON
      - name: Run core C++ tests via colcon
        run: |
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          colcon test --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose
  ros_build_result:
    if: always()
    needs: [check_relevant_changes, ros_build_with_rosdep, ros_build_no_rosdep]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "check_relevant_changes: ${{ needs.check_relevant_changes.result }}"
          echo "ros_build_with_rosdep: ${{ needs.ros_build_with_rosdep.result }}"
          echo "ros_build_no_rosdep: ${{ needs.ros_build_no_rosdep.result }}"
          [ "${{ needs.check_relevant_changes.result }}" = success ] || exit 1
          for result in "${{ needs.ros_build_with_rosdep.result }}" "${{ needs.ros_build_no_rosdep.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
