name: Lint
on:
  pull_request:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pre_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: pre-commit/action@v3.0.1
  check_relevant_changes:
    runs-on: ubuntu-latest
    outputs:
      continue_run: ${{ steps.check.outputs.continue_run }}
    env:
      IGNORED_FOLDERS: "rko_lio/python/rko_lio|tests|docs|launch|config|.github"
      IGNORED_FILES: "colcon.pkg|rosdoc2.yaml|CHANGELOG.rst|LICENSE|README.md|pyproject.toml|.pre-commit-config.yaml"
      SELF: ".github/workflows/lint.yaml"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          changed_files=$(git diff --name-only origin/master)
          echo "Changed files: $changed_files"
          if echo "$changed_files" | grep -vE "^($IGNORED_FOLDERS)/|^($IGNORED_FILES)$" | grep -q . ||
             echo "$changed_files" | grep -qxF "$SELF"; then
            echo "continue_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "continue_run=false" >> "$GITHUB_OUTPUT"
          fi
  clang_tidy:
    # minutes per translation unit, so it lives here rather than in pre-commit
    needs: check_relevant_changes
    if: needs.check_relevant_changes.outputs.continue_run == 'true'
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical-ros-base
    env:
      GIT_LFS_SKIP_SMUDGE: 1
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build clang-tidy python3-pybind11 python3-dev
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y
      # the pybind sources are a separate cmake project, so they need their own compile database
      - name: Configure
        run: |
          . /opt/ros/lyrical/setup.sh
          cmake -G Ninja -S . -B build/ros \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DRKO_LIO_FETCH_CONTENT_DEPS=OFF \
            -DRKO_LIO_BUILD_ROS=ON
          cmake -G Ninja -S rko_lio/python/pybind -B build/python \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DRKO_LIO_FETCH_CONTENT_DEPS=ON \
            -DRKO_LIO_BUILD_ROS=OFF
      - name: Run clang-tidy
        run: |
          for db in build/ros build/python; do
            run-clang-tidy -p "$db" -j "$(nproc)" -quiet -warnings-as-errors='*' "$PWD/rko_lio/.*\.cpp$"
          done
