name: Python Bindings
on:
  pull_request:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check_relevant_changes:
    uses: ./.github/workflows/check_relevant_changes.yaml
    with:
      ignored_folders: "rko_lio/ros|tests/core|cmake/dependencies/catch2|docs|launch|config|.github"
      ignored_files: "colcon.pkg|package.xml|rosdoc2.yaml|CHANGELOG.rst|LICENSE|README.md|.pre-commit-config.yaml"
      self: ".github/workflows/python_bindings.yaml|.github/workflows/check_relevant_changes.yaml"
  python_bindings:
    needs: check_relevant_changes
    if: needs.check_relevant_changes.outputs.continue_run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, scalar: float}
          - {os: ubuntu-22.04-arm, scalar: double}
          - {os: ubuntu-24.04, scalar: double}
          - {os: ubuntu-24.04-arm, scalar: float}
          - {os: macos-14, scalar: float}
          - {os: macos-15, scalar: double}
          - {os: windows-2022, scalar: double}
    env:
      GIT_LFS_SKIP_SMUDGE: 1
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python3
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install pip
        run: python -m pip install --upgrade pip
      - name: Build with pip
        run: python -m pip install --verbose . pytest
        env:
          SKBUILD_CMAKE_DEFINE: RKO_LIO_SCALAR=${{ matrix.scalar }}
      - name: Run pytest
        run: pytest -v -rs
  python_bindings_optional:
    needs: check_relevant_changes
    if: needs.check_relevant_changes.outputs.continue_run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2022
    env:
      GIT_LFS_SKIP_SMUDGE: 1
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python3
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install pip
        run: python -m pip install --upgrade pip
      - name: Install package with optional dependencies
        run: python -m pip install --verbose ".[all]" pytest
      - name: Run pytest with optional dependency tests
        run: pytest -v -rs
  python_bindings_result:
    if: always()
    needs: [check_relevant_changes, python_bindings, python_bindings_optional]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "check_relevant_changes: ${{ needs.check_relevant_changes.result }}"
          echo "python_bindings: ${{ needs.python_bindings.result }}"
          echo "python_bindings_optional: ${{ needs.python_bindings_optional.result }}"
          [ "${{ needs.check_relevant_changes.result }}" = success ] || exit 1
          for result in "${{ needs.python_bindings.result }}" "${{ needs.python_bindings_optional.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
