name: Core C++ Tests
on:
  pull_request:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check_relevant_changes:
    uses: ./.github/workflows/check_relevant_changes.yaml
    with:
      ignored_folders: "rko_lio/ros|rko_lio/python|tests/python|docs|launch|config|.github"
      ignored_files: "colcon.pkg|package.xml|rosdoc2.yaml|CHANGELOG.rst|LICENSE|README.md|pyproject.toml|.pre-commit-config.yaml"
      self: ".github/workflows/core_tests.yaml|.github/workflows/check_relevant_changes.yaml"
  core_tests:
    needs: check_relevant_changes
    if: needs.check_relevant_changes.outputs.continue_run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, scalar: float}
          - {os: ubuntu-22.04-arm, scalar: double}
          - {os: ubuntu-24.04, scalar: double}
          - {os: ubuntu-24.04-arm, scalar: float}
          - {os: macos-14, scalar: float}
          - {os: macos-15, scalar: double}
    env:
      GIT_LFS_SKIP_SMUDGE: 1
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        shell: bash
        run: |
          cmake -G Ninja -S . -B build/core \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DRKO_LIO_FETCH_CONTENT_DEPS=ON \
            -DRKO_LIO_BUILD_ROS=OFF \
            -DRKO_LIO_BUILD_TESTS=ON \
            -DRKO_LIO_SCALAR=${{ matrix.scalar }}
      - name: Build
        shell: bash
        run: cmake --build build/core
      - name: Test
        shell: bash
        run: ctest --test-dir build/core --output-on-failure
  core_tests_result:
    if: always()
    needs: [check_relevant_changes, core_tests]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "check_relevant_changes: ${{ needs.check_relevant_changes.result }}"
          echo "core_tests: ${{ needs.core_tests.result }}"
          [ "${{ needs.check_relevant_changes.result }}" = success ] || exit 1
          for result in "${{ needs.core_tests.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
